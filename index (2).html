<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --message-user: #e0e7ff;
            --message-ai: #ffffff;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --accent-color: #818cf8;
            --accent-hover: #6366f1;
            --message-user: #3730a3;
            --message-ai: #1e293b;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .chat-container { background-color: var(--bg-secondary); border-color: var(--border-color); }
        .message-user { background-color: var(--message-user); }
        .message-ai { background-color: var(--message-ai); border: 1px solid var(--border-color); }
        .input-area { background-color: var(--bg-tertiary); border-color: var(--border-color); }
        .sidebar-panel { background-color: var(--bg-secondary); border-color: var(--border-color); }
        .icon-btn { color: var(--text-secondary); transition: all 0.2s ease; cursor: pointer; }
        .icon-btn:hover { color: var(--accent-color); }
        .preview-panel { transform: translateX(-100%); transition: transform 0.3s ease; }
        .preview-panel.open { transform: translateX(0); }
        .dropdown-item { background-color: var(--bg-tertiary); border-color: var(--border-color); }
        .dropdown-item:hover { background-color: var(--accent-color); color: white; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .typing-indicator span { animation: bounce 1.4s infinite ease-in-out; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .file-upload-zone { border: 2px dashed var(--border-color); transition: all 0.3s ease; }
        .file-upload-zone.dragover { border-color: var(--accent-color); background-color: var(--bg-tertiary); }

        /* Offline utility subset */
        .flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 auto}
        .items-center{align-items:center}.items-end{align-items:flex-end}.justify-between{justify-content:space-between}.justify-start{justify-content:flex-start}.justify-end{justify-content:flex-end}.justify-center{justify-content:center}
        .gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
        .h-full{height:100%}.h-screen{height:100vh}.w-full{width:100%}.w-1\/2{width:50%}
        .fixed{position:fixed}.inset-0{top:0;right:0;bottom:0;left:0}.left-0{left:0}.top-0{top:0}.z-40{z-index:40}.z-50{z-index:50}
        .overflow-auto{overflow:auto}.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
        .p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}.p-6{padding:1.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}.px-5{padding-left:1.25rem;padding-right:1.25rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}.py-1{padding-top:.25rem;padding-bottom:.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}
        .mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}.mb-5{margin-bottom:1.25rem}.mb-6{margin-bottom:1.5rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-6{margin-top:1.5rem}
        .space-y-2>*+*{margin-top:.5rem}.space-y-4>*+*{margin-top:1rem}
        .text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}
        .font-medium{font-weight:500}.font-semibold{font-weight:600}.text-center{text-align:center}.text-white{color:#fff}
        .rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}.rounded-2xl{border-radius:1rem}.rounded-tl-sm{border-top-left-radius:.125rem}.rounded-bl-sm{border-bottom-left-radius:.125rem}.rounded-br-sm{border-bottom-right-radius:.125rem}.rounded-full{border-radius:9999px}
        .border{border:1px solid var(--border-color)}.border-b{border-bottom:1px solid var(--border-color)}.border-r{border-right:1px solid var(--border-color)}.border-t{border-top:1px solid var(--border-color)}
        .max-w-2xl{max-width:42rem}.max-w-md{max-width:28rem}.min-h-96{min-height:24rem}.max-h-32{max-height:8rem}.max-h-64{max-height:16rem}
        .shadow-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05)}.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
        .transition-colors,.transition-all{transition:all .3s ease}.duration-300{transition-duration:.3s}
        .mr-1{margin-right:.25rem}.mx-4{margin-left:1rem;margin-right:1rem}.pt-5{padding-top:1.25rem}.ring-2{box-shadow:0 0 0 2px var(--accent-color)}.opacity-50{opacity:.5}

        /* Icon fallbacks */
        i.fas,i.far,i.fab{font-style:normal;display:inline-block;line-height:1;vertical-align:middle;min-width:1em}
        i.fa-robot::before{content:"🤖"}
        i.fa-cog::before{content:"⚙️"}
        i.fa-moon::before{content:"🌙"}
        i.fa-sun::before{content:"☀️"}
        i.fa-times::before{content:"✖"}
        i.fa-paperclip::before{content:"📎"}
        i.fa-paper-plane::before{content:"🡆"}
        i.fa-trash-alt::before{content:"🗑️"}
        i.fa-download::before{content:"⬇️"}
        i.fa-check::before{content:"✔"}
        i.fa-eye::before{content:"👁️"}
        i.fa-exclamation-triangle::before{content:"⚠️"}
        i.fa-exclamation-circle::before{content:"⚠️"}
        i.fa-info-circle::before{content:"ℹ️"}
        i.fa-language::before{content:"🌐"}
        i.fa-image::before{content:"🖼️"}
        i.fa-microphone::before{content:"🎤"}
        i.fa-code::before{content:"💻"}
        i.fa-vector-square::before{content:"🔳"}
        i.fa-cloud-upload-alt::before{content:"☁️"}
        i.fa-file-excel::before{content:"📄"}
        i.fa-check-circle::before{content:"✔"}
        i.fa-brain::before{content:"🧠"}
        i.fa-cube::before{content:"◼️"}
        i.fa-spinner::before{content:"";display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
        .fa-spin{animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Input and select styling */
        input, select {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="h-screen flex flex-col overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between p-5 border-b chat-container shadow-lg">
            <div class="flex items-center gap-3">
                <i class="fa-robot text-2xl"></i>
                <h1 class="text-xl font-semibold">AI Chat Assistant</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="darkModeToggle" class="icon-btn p-2 rounded-lg" title="Переключить тему">
                    <i class="fa-moon text-lg"></i>
                </button>
                <a href="settings.html" class="icon-btn p-2 rounded-lg" title="Настройки">
                    <i class="fa-cog text-lg"></i>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Chat Area -->
            <div class="flex-1 flex flex-col">
                <!-- Messages -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-5 space-y-4 scrollbar-thin chat-container">
                    <div class="flex items-center gap-3 p-4 rounded-xl" style="background-color: var(--bg-tertiary);">
                        <i class="fa-info-circle text-lg"></i>
                        <p style="color: var(--text-secondary);">Приветствуем вас! Загрузите файл данных или задайте вопрос для начала.</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area p-5 border-t">
                    <div class="flex items-end gap-3">
                        <button id="attachBtn" class="icon-btn p-2 rounded-lg" title="Прикрепить файл">
                            <i class="fa-paperclip text-lg"></i>
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept=".csv,.xlsx,.xls">
                        <textarea id="messageInput" class="flex-1 rounded-xl p-3 border resize-none" style="background-color: var(--bg-secondary); border-color: var(--border-color);" placeholder="Введите сообщение..." rows="2"></textarea>
                        <button id="sendBtn" class="p-3 rounded-xl text-white font-medium transition-colors" style="background-color: var(--accent-color);">
                            <i class="fa-paper-plane text-lg"></i>
                        </button>
                    </div>
                    <div id="attachedFiles" class="mt-3 flex flex-wrap gap-2"></div>
                </div>
            </div>

            <!-- Sidebar Preview -->
            <div id="previewPanel" class="preview-panel w-1/2 flex flex-col border-l sidebar-panel overflow-hidden" style="border-color: var(--border-color);">
                <div class="p-5 border-b flex items-center justify-between" style="border-color: var(--border-color);">
                    <h3 class="font-semibold">Превью</h3>
                    <button id="closePreviewBtn" class="icon-btn p-2 rounded-lg">
                        <i class="fa-times text-lg"></i>
                    </button>
                </div>
                <div id="previewContent" class="flex-1 overflow-y-auto p-5 scrollbar-thin"></div>
            </div>
        </div>
    </div>

    <script>
        function computeBasePath() {
            const path = window.location.pathname;
            const m = path.match(/^(.*?\/proxy\/\d+)/);
            if (m) return m[1];
            return '';
        }
        const BASE_PATH = computeBasePath();
        function apiUrl(p) { return BASE_PATH + p; }

        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        
        if (isDarkMode) {
            document.documentElement.classList.add('dark');
        }

        darkModeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const newState = document.documentElement.classList.contains('dark');
            localStorage.setItem('darkMode', newState);
        });

        // Chat functionality will be added here
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Chat page loaded');
        });
    </script>
</body>
</html>
